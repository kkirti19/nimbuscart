<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NimbusCart</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
            background: #f5f5f5;
        }

        h1 {
            text-align: center;
        }

        .card {
            background: white;
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        input {
            padding: 10px;
            margin: 5px;
            width: 180px;
        }

        button {
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            padding: 10px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #eee;
        }

        #message {
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>🛒 NimbusCart</h1>

    <div class="card">
        <h2>Add Product</h2>

        <input
            id="name"
            type="text"
            placeholder="Product name"
        >

        <input
            id="price"
            type="number"
            step="0.01"
            placeholder="Price"
        >

        <input
            id="stock"
            type="number"
            placeholder="Stock"
        >

        <button onclick="addProduct()">Add Product</button>

        <div id="message"></div>
    </div>


    <div class="card">
        <h2>Products</h2>

        <button onclick="loadProducts()">Refresh Products</button>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Price</th>
                    <th>Stock</th>
                </tr>
            </thead>

            <tbody id="products">
            </tbody>
        </table>
    </div>


    <script>
        const API_URL = "http://localhost:5000";

        async function loadProducts() {
            try {
                const response = await fetch(`${API_URL}/api/items`);
                const products = await response.json();

                const table = document.getElementById("products");

                table.innerHTML = "";

                products.forEach(product => {
                    const row = document.createElement("tr");

                    row.innerHTML = `
                        <td>${product.id}</td>
                        <td>${product.name}</td>
                        <td>₹${product.price}</td>
                        <td>${product.stock}</td>
                    `;

                    table.appendChild(row);
                });

            } catch (error) {
                console.error(error);

                document.getElementById("message").textContent =
                    "Could not connect to API.";
            }
        }


        async function addProduct() {
            const name = document.getElementById("name").value;
            const price = document.getElementById("price").value;
            const stock = document.getElementById("stock").value;

            if (!name || !price || !stock) {
                document.getElementById("message").textContent =
                    "Please fill all fields.";

                return;
            }

            try {
                const response = await fetch(`${API_URL}/api/items`, {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        name: name,
                        price: Number(price),
                        stock: Number(stock)
                    })
                });

                const product = await response.json();

                if (!response.ok) {
                    throw new Error(product.error || "Failed to add product");
                }

                document.getElementById("message").textContent =
                    `Product "${product.name}" added successfully.`;

                document.getElementById("name").value = "";
                document.getElementById("price").value = "";
                document.getElementById("stock").value = "";

                loadProducts();

            } catch (error) {
                console.error(error);

                document.getElementById("message").textContent =
                    error.message;
            }
        }


        loadProducts();
    </script>

</body>
</html>
